<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1016">
<title>Pixel Arcade</title>
<meta name="description" content="Pixel Arcade: Snake, Bricks, Pixel Bird and 2048 in your browser. Free, no install, works on phone and desktop.">
<meta property="og:title" content="Pixel Arcade">
<meta property="og:description" content="Four pixel mini-games in your browser: Snake, Bricks, Pixel Bird, 2048.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="menuBg" class="menu-bg" aria-hidden="true"></div>

<div id="app">
  <header id="hud">
    <button id="backBtn" class="hud-btn" data-i18n="back">← Меню</button>
    <div id="scoreDisplay" class="score" hidden>
      <span class="score-label" data-i18n="scoreLabel">Очки</span>
      <span id="scoreValue" class="score-value">0</span>
    </div>
    <button id="pauseBtn" class="hud-btn" data-i18n="pause">Пауза</button>
    <button id="settingsBtn" class="hud-btn" hidden>⚙ <span data-i18n="settingsBtn">Настройки</span></button>
  </header>

  <main id="stage">
    <section id="menuScreen" class="screen">
      <h1 class="logo">ARCADE</h1>
      <p class="tagline" data-i18n="tagline">Выбери игру</p>
      <div id="gameList" class="game-list"></div>
    </section>

    <section id="settingsScreen" class="screen" hidden>
      <h1 data-i18n="settingsTitle">Настройки</h1>

      <div class="settings-row">
        <span data-i18n="soundLabel">Звук</span>
        <button id="soundBtn" class="hud-btn" aria-label="Звук">🔇</button>
      </div>

      <div class="settings-row">
        <span data-i18n="languageLabel">Язык</span>
        <div class="lang-switch">
          <button class="lang-btn" data-lang="ru">RU</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>

      <button id="closeSettingsBtn" class="hud-btn" data-i18n="closeSettings">← Назад</button>
    </section>

    <div id="canvasWrap" class="screen" hidden>
      <canvas id="gameCanvas"></canvas>

      <div id="pauseOverlay" class="overlay" hidden>
        <div class="overlay-box">
          <p data-i18n="pauseTitle">Пауза</p>
          <button id="resumeBtn" data-i18n="resume">Продолжить</button>
          <button id="pauseMenuBtn" class="btn-secondary" data-i18n="menuBtn">В меню</button>
        </div>
      </div>

      <div id="countdownOverlay" class="overlay overlay--countdown" hidden>
        <div class="overlay-box">
          <p id="countdownNumber" class="countdown-number">3</p>
        </div>
      </div>

      <div id="gameOverOverlay" class="overlay" hidden>
        <div class="overlay-box">
          <p data-i18n="gameOverTitle">Игра окончена</p>
          <p id="finalScore" class="final-score"></p>
          <button id="retryBtn" data-i18n="retryBtn">Заново</button>
          <button id="menuBtn" class="btn-secondary" data-i18n="menuBtn">В меню</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="js/storage.js"></script>
<script src="js/i18n.js"></script>
<script src="js/theme.js"></script>
<script src="js/input.js"></script>
<script src="js/utils.js"></script>
<script src="js/pixel.js"></script>
<script src="js/fx.js"></script>
<script src="js/games/snake.js"></script>
<script src="js/games/breakout.js"></script>
<script src="js/games/flappy.js"></script>
<script src="js/games/2048.js"></script>
<script src="js/main.js"></script>
</body>
</html>
